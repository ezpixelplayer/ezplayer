<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Audio Demo</title>
<script src="_sdk.js"></script>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --panel: #161a24; --line: #2a3040; --text: #e8ebf2; --dim: #8b93a7; --accent: #7ee787; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 10px 12px; gap: 10px; min-height: 100dvh; touch-action: manipulation; user-select: none; }
  header { display: flex; width: 100%; max-width: 480px; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 2px; }
  #bus { color: var(--dim); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 480px; }
  .stat { background: var(--panel); border-radius: 8px; padding: 6px 8px; text-align: center; }
  .stat small { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
  #last { width: 100%; max-width: 480px; background: var(--panel); border-radius: 8px; padding: 10px; color: var(--dim); font-size: 14px; min-height: 3.2em; }
  #last b { color: var(--text); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 480px; }
  button { font: inherit; font-size: 18px; font-weight: 600; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; height: 64px; cursor: pointer; }
  button:active { background: #243048; }
  button:disabled { opacity: 0.35; }
  button small { display: block; font-weight: 400; font-size: 12px; color: var(--dim); }
  .wide { grid-column: 1 / -1; height: 56px; }
  #bar { background: #1a3a2a; border-color: var(--accent); }
  #tune { background: #1a2a3a; border-color: #4cc9f0; }
  #tune.on { background: #2a4a5a; }
  #stop { background: #3a1a1a; border-color: #ff6060; }
  #message { min-height: 1.3em; color: var(--dim); text-align: center; width: 100%; max-width: 480px; margin-top: auto; }
  #message.alert { color: #ffb347; }
</style>
</head>
<body>
<header><h1>AUDIO DEMO</h1><span id="bus"></span></header>
<div class="stats">
  <div class="stat"><small>Sounds</small><b id="plays">0</b></div>
  <div class="stat"><small>Bars</small><b id="bars">0</b></div>
  <div class="stat"><small>Volume</small><b id="volume">-</b></div>
</div>
<div id="last">No sound played yet.</div>
<div class="pad">
  <button data-type="kick">Kick</button>
  <button data-type="snare">Snare</button>
  <button data-type="hat">Hat</button>
  <button data-type="zap">Zap</button>
  <button data-type="coin">Coin</button>
  <button id="bar" data-type="bar">Drum bar<small>scheduled</small></button>
  <button id="tune" class="wide" data-type="tune">Tune<small>streamed over UDP</small></button>
  <button id="stop" class="wide" data-type="stop">Stop all</button>
</div>
<div id="message">Connecting...</div>

<script>
  const el = (id) => document.getElementById(id);
  let app, status = { phase: 'unavailable', message: 'Connecting...' };

  function render() {
    const ready = status.phase === 'ready';
    el('bus').textContent = ready ? `bus ${status.bus}, ${status.leadMs} ms lead` : '';
    el('plays').textContent = status.plays ?? 0;
    el('bars').textContent = status.bars ?? 0;
    el('volume').textContent = typeof status.volume === 'number' ? status.volume.toFixed(2) : '-';
    const p = status.lastPlay;
    if (p) {
      el('last').innerHTML = `<b>${p.clip}</b> started ${p.startsAfterMs} ms after the player took the call, ${p.roundTripMs} ms round trip` +
        (p.lateMs ? `, ${Math.round(p.lateMs)} ms late` : '');
    } else {
      el('last').textContent = 'No sound played yet.';
    }
    el('message').textContent = status.message || '';
    el('message').className = /not reachable|no audio|: /.test(status.message || '') ? 'alert' : '';
    for (const b of document.querySelectorAll('button[data-type]')) b.disabled = !app || !ready;
    el('tune').disabled = !app || !ready || !status.tune?.available;
    el('tune').className = `wide${status.tune?.streaming ? ' on' : ''}`;
    el('tune').querySelector('small').textContent = status.tune?.streaming
      ? `playing on ${status.tune.bus}`
      : status.tune?.available ? `streamed over UDP to ${status.tune.bus}` : 'no tune bus set';
  }

  function send(type) {
    if (!app) return;
    app.send({ type }).catch((err) => {
      el('message').textContent = /429/.test(err.message) ? 'Too many taps; wait a moment.' : `Could not send: ${err.message}`;
      el('message').className = 'alert';
    });
  }

  for (const b of document.querySelectorAll('button[data-type]')) {
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); send(b.dataset.type); });
  }
  // Keys for anyone opening the page on a laptop.
  const keys = { k: 'kick', s: 'snare', h: 'hat', z: 'zap', c: 'coin', b: 'bar', t: 'tune', ' ': 'stop' };
  addEventListener('keydown', (e) => { if (keys[e.key]) { e.preventDefault(); send(keys[e.key]); } });

  async function init() {
    const a = EZApp.connect();
    await a.ready;
    app = a;
    app.onStatus((s) => { if (s) { status = s; render(); } });
    render();
  }
  render();
  init().catch((e) => { el('message').textContent = `Could not load the app SDK: ${e.message}`; el('message').className = 'alert'; });
</script>
</body>
</html>
