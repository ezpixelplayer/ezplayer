<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Flashlight Tag</title>
<script src="_sdk.js"></script>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --panel: #161a24; --line: #2a3040; --text: #e8ebf2; --dim: #8b93a7; --accent: #ffd000; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 10px 12px; gap: 10px; min-height: 100dvh; touch-action: manipulation; user-select: none; }
  header { display: flex; width: 100%; max-width: 480px; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 2px; }
  #sound { color: var(--dim); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 480px; }
  .stat { background: var(--panel); border-radius: 8px; padding: 6px 8px; text-align: center; }
  .stat small { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
  #map { width: 100%; max-width: 480px; aspect-ratio: 10 / 7; background: #0f1a24; border: 1px solid var(--line); border-radius: 8px; }
  #message { min-height: 1.3em; color: var(--dim); text-align: center; width: 100%; max-width: 480px; }
  #message.alert { color: #ffb347; }
  button { font: inherit; font-size: 20px; font-weight: 600; color: var(--text); background: #2a2a1a; border: 1px solid var(--accent); border-radius: 12px; height: 56px; width: 100%; max-width: 480px; cursor: pointer; }
  button:active { background: #3a3a20; }
  button:disabled { opacity: 0.35; }
  button.stop { background: #3a1a1a; border-color: #ff6060; }
  .legend { display: flex; gap: 14px; color: var(--dim); font-size: 13px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
<header><h1>FLASHLIGHT TAG</h1><span id="sound"></span></header>
<div class="stats">
  <div class="stat"><small>Tags</small><b id="tags">0</b></div>
  <div class="stat"><small>It</small><b id="it">-</b></div>
  <div class="stat"><small>Running</small><b id="time">0:00</b></div>
</div>
<canvas id="map" width="480" height="336"></canvas>
<div class="legend">
  <span><span class="dot" style="background:#40b0ff"></span>Blue</span>
  <span><span class="dot" style="background:#ff7040"></span>Orange</span>
  <span><span class="dot" style="background:#dddddd"></span>Ghost</span>
  <span><span class="dot" style="background:#2a8a3a"></span>Tree</span>
</div>
<div id="message">Connecting...</div>
<button id="toggle" disabled>Start</button>

<script>
  const el = (id) => document.getElementById(id);
  const canvas = el('map');
  const ctx = canvas.getContext('2d');
  let app, status = { phase: 'idle', message: 'Connecting...' };

  function mmss(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  // Top-down view of the field: u left to right, v top to bottom.
  function drawMap(g) {
    const W = canvas.width, Hc = canvas.height;
    ctx.clearRect(0, 0, W, Hc);
    if (!g) {
      ctx.fillStyle = '#334';
      ctx.font = '16px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('No game running', W / 2, Hc / 2);
      return;
    }
    const pad = 14;
    const fieldW = W - pad * 2;
    const fieldH = Math.min(Hc - pad * 2, fieldW * (g.aspect || 0.7));
    const ox = pad, oy = (Hc - fieldH) / 2;
    const X = (u) => ox + ((u + 1) / 2) * fieldW;
    const Y = (v) => oy + ((v + 1) / 2) * fieldH;
    ctx.strokeStyle = '#305070';
    ctx.lineWidth = 1;
    ctx.strokeRect(ox, oy, fieldW, fieldH);
    for (const t of g.trees) {
      ctx.fillStyle = '#2a8a3a';
      ctx.beginPath(); ctx.arc(X(t.u), Y(t.v), 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#6e4623';
      ctx.beginPath(); ctx.arc(X(t.u), Y(t.v), 3, 0, Math.PI * 2); ctx.fill();
    }
    for (const p of g.players) {
      const x = X(p.u), y = Y(p.v);
      if (p.it) {
        // The lit flashlight: a cone in the heading, dim during the head start.
        const a = Math.atan2(p.hv * fieldH / 2, p.hu * fieldW / 2);
        ctx.fillStyle = g.chasing ? 'rgba(255,240,192,0.35)' : 'rgba(128,96,64,0.25)';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.arc(x, y, fieldW * 0.21, a - 0.13, a + 0.13);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = p.spooked ? '#a0c0a0' : p.color;
      ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();
      if (p.it) { ctx.strokeStyle = '#ffd000'; ctx.lineWidth = 3; ctx.stroke(); }
    }
    for (const gh of g.ghosts) {
      ctx.globalAlpha = gh.stunned ? 0.25 : 0.9;
      ctx.fillStyle = gh.color;
      const x = X(gh.u), y = Y(gh.v);
      ctx.beginPath();
      ctx.arc(x, y - 3, 7, Math.PI, 0);
      ctx.lineTo(x + 7, y + 6); ctx.lineTo(x + 3, y + 3); ctx.lineTo(x, y + 6); ctx.lineTo(x - 3, y + 3); ctx.lineTo(x - 7, y + 6);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    const playing = status.phase === 'playing';
    const g = status.game;
    el('tags').textContent = g ? g.tags : 0;
    el('it').textContent = g ? g.it : '-';
    el('it').style.color = g ? (g.it === 'Blue' ? '#40b0ff' : '#ff7040') : '';
    el('time').textContent = mmss(status.runningMs || 0);
    el('sound').textContent = playing ? (status.sound ? 'Sound on' : 'No sound') : '';
    let msg = status.message || '';
    if (playing && g && !g.chasing) msg = `${g.it} is it: head start ${Math.ceil(g.countdownMs / 1000)} s`;
    else if (playing && g) msg = `${g.it} is chasing${status.field ? ` on the ${status.field.plane}` : ''}`;
    el('message').textContent = msg;
    el('message').className = /not reachable|Could not/.test(msg) ? 'alert' : '';
    const b = el('toggle');
    b.textContent = playing ? 'Stop' : 'Start';
    b.className = playing ? 'stop' : '';
    b.disabled = !app;
    drawMap(g);
  }

  el('toggle').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!app) return;
    el('toggle').disabled = true;
    app.send({ type: status.phase === 'playing' ? 'stop' : 'start' })
      .catch((err) => { el('message').textContent = `Could not send: ${err.message}`; el('message').className = 'alert'; })
      .finally(() => { el('toggle').disabled = false; });
  });

  async function init() {
    const a = EZApp.connect();
    await a.ready;
    app = a;
    app.onStatus((s) => { if (s) { status = s; render(); } });
    render();
  }
  render();
  init().catch((e) => { el('message').textContent = `Could not load the app SDK: ${e.message}`; el('message').className = 'alert'; });
</script>
</body>
</html>
