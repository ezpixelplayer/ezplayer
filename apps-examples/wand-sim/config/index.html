<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wand Simulator settings</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --panel: #161a24; --line: #2a3040; --text: #e8ebf2; --dim: #8b93a7; --accent: #ffb347; --bad: #ff5c5c; --good: #5fe39a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  section { background: var(--panel); border-radius: 12px; padding: 12px 14px; }
  label { display: block; font-size: 13px; color: var(--dim); margin-top: 8px; }
  input { font: inherit; color: var(--text); background: #0f131c; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; margin-top: 3px; }
  button { font: inherit; font-weight: 600; color: #0b0d12; background: var(--accent); border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; margin-top: 16px; }
  #msg { margin-top: 10px; min-height: 1.3em; color: var(--dim); }
  #msg.bad { color: var(--bad); }
  #msg.good { color: var(--good); }
  .hint { color: var(--dim); font-size: 13px; margin-top: 6px; }
  code { color: var(--text); }
</style>
</head>
<body>
<h1>Wand Simulator settings</h1>
<section>
  <label>Source name<input id="source" pattern="[A-Za-z0-9][A-Za-z0-9._~-]{0,63}"></label>
  <div class="hint">Poses post to <code>/api/ezp/inputs/&lt;source&gt;/pose</code>. On the Apps card, under Show inputs, map this source and the name <code>pose</code> to the Tag the Monsters instance's <code>pose</code> input. Give the real base station the same source name later and the mapping row stays.</div>
  <label>Poses per second (1 to 100)<input id="rateHz" type="number" min="1" max="100" step="1"></label>
</section>
<button id="save">Save</button>
<div id="msg"></div>
<script>
(function () {
  const el = (id) => document.getElementById(id);
  let app, settings = {};
  function show() {
    el('source').value = settings.source ?? 'wand-sim';
    el('rateHz').value = settings.rateHz ?? 20;
  }
  async function save() {
    const source = el('source').value.trim();
    if (!/^[A-Za-z0-9][A-Za-z0-9._~-]{0,63}$/.test(source)) {
      el('msg').textContent = 'The source is 1 to 64 letters, digits, dots, dashes, underscores or tildes, starting with a letter or digit.';
      el('msg').className = 'bad';
      return;
    }
    const next = { source, rateHz: Math.min(100, Math.max(1, Number(el('rateHz').value) || 20)) };
    try {
      await app.put('private', 'settings', next);
      settings = next;
      el('msg').textContent = 'Saved.';
      el('msg').className = 'good';
    } catch (e) {
      el('msg').textContent = `Could not save: ${e.message}`;
      el('msg').className = 'bad';
    }
  }
  async function init() {
    app = window.EZApp.connect();
    try { settings = (await app.get('private', 'settings')) || {}; } catch { settings = {}; }
    show();
    el('save').addEventListener('click', save);
  }
  const sdk = document.createElement('script');
  sdk.src = '_sdk.js';
  sdk.onload = init;
  sdk.onerror = () => { el('msg').textContent = 'Could not load the app SDK.'; el('msg').className = 'bad'; };
  document.head.appendChild(sdk);
})();
</script>
</body>
</html>
