<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Scene Objects Demo</title>
<script src="_sdk.js"></script>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --panel: #161a24; --line: #2a3040; --text: #e8ebf2; --dim: #8b93a7; --accent: #4cc9f0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 10px 12px; gap: 10px; min-height: 100dvh; touch-action: manipulation; user-select: none; }
  header { display: flex; width: 100%; max-width: 480px; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 2px; }
  #where { color: var(--dim); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 480px; }
  .stat { background: var(--panel); border-radius: 8px; padding: 6px 8px; text-align: center; }
  .stat small { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .objects { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 6px; }
  .obj { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; background: var(--panel); border-radius: 8px; padding: 8px 10px; }
  .obj b { font-size: 15px; }
  .obj small { color: var(--dim); font-size: 12px; }
  .obj .detail { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-variant-numeric: tabular-nums; color: var(--accent); }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-left: 6px; }
  .empty { color: var(--dim); text-align: center; padding: 20px 0; }
  #message { min-height: 1.3em; color: var(--dim); text-align: center; width: 100%; max-width: 480px; margin-top: auto; }
  #message.alert { color: #ffb347; }
  button { font: inherit; font-size: 20px; font-weight: 600; color: var(--text); background: #1a3a4a; border: 1px solid var(--accent); border-radius: 12px; height: 56px; width: 100%; max-width: 480px; cursor: pointer; }
  button:active { background: #243048; }
  button:disabled { opacity: 0.35; }
  button.stop { background: #3a1a1a; border-color: #ff6060; }
</style>
</head>
<body>
<header><h1>SCENE OBJECTS</h1><span id="where"></span></header>
<div class="stats">
  <div class="stat"><small>Running</small><b id="time">0:00</b></div>
  <div class="stat"><small>Updates</small><b id="patches">0</b></div>
  <div class="stat"><small>Relaunched</small><b id="relaunches">0</b></div>
</div>
<div class="objects" id="objects"><div class="empty">No objects in the Show View</div></div>
<div id="message">Connecting...</div>
<button id="toggle" disabled>Start</button>

<script>
  const el = (id) => document.getElementById(id);
  let app, status = { phase: 'idle', message: 'Connecting...', objects: [] };

  function mmss(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function render() {
    const playing = status.phase === 'playing';
    el('time').textContent = mmss(status.runningMs || 0);
    el('patches').textContent = status.patches ?? 0;
    el('relaunches').textContent = status.relaunches ?? 0;
    el('where').textContent = status.center ? `at (${status.center[0]}, ${status.center[1]}), size ${status.size}` : '';
    const list = el('objects');
    list.replaceChildren();
    if (!status.objects?.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = 'No objects in the Show View';
      list.append(d);
    }
    for (const o of status.objects || []) {
      const row = document.createElement('div');
      row.className = 'obj';
      const name = document.createElement('b');
      name.textContent = o.name;
      const color = /#[0-9a-f]{6}/i.exec(o.detail || '');
      if (color) {
        const sw = document.createElement('span');
        sw.className = 'swatch';
        sw.style.background = color[0];
        name.append(sw);
      }
      const kind = document.createElement('small');
      kind.textContent = o.kind;
      const detail = document.createElement('span');
      detail.className = 'detail';
      detail.textContent = o.detail;
      row.append(name, kind, detail);
      list.append(row);
    }
    el('message').textContent = status.message || '';
    el('message').className = /not reachable|Could not/.test(status.message || '') ? 'alert' : '';
    const b = el('toggle');
    b.textContent = playing ? 'Stop' : 'Start';
    b.className = playing ? 'stop' : '';
    b.disabled = !app;
  }

  el('toggle').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!app) return;
    el('toggle').disabled = true;
    app.send({ type: status.phase === 'playing' ? 'stop' : 'start' })
      .catch((err) => { el('message').textContent = `Could not send: ${err.message}`; el('message').className = 'alert'; })
      .finally(() => { el('toggle').disabled = false; });
  });

  async function init() {
    const a = EZApp.connect();
    await a.ready;
    app = a;
    app.onStatus((s) => { if (s) { status = s; render(); } });
    render();
  }
  render();
  init().catch((e) => { el('message').textContent = `Could not load the app SDK: ${e.message}`; el('message').className = 'alert'; });
</script>
</body>
</html>
