<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Overlay Effects</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --panel: #161a24; --line: #2a3040; --text: #e8ebf2; --dim: #8b93a7; --accent: #4cc9f0; --warn: #ffb347; --bad: #ff5c5c; --good: #5fe39a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 12px 16px 24px; gap: 12px; }
  header { display: flex; width: 100%; max-width: 640px; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
  #phase { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
  #phase.running { color: var(--good); }
  #phase.starting, #phase.stopping { color: var(--accent); }
  .big { width: 100%; max-width: 640px; background: var(--panel); border-radius: 14px; padding: 18px 20px; text-align: center; }
  .big small { display: block; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .big b { display: block; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
  .big b.low { color: var(--warn); }
  .big b.bad { color: var(--bad); }
  .big span { color: var(--dim); font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 640px; }
  .stat { background: var(--panel); border-radius: 10px; padding: 8px 10px; text-align: center; }
  .stat small { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat b.warn { color: var(--warn); }
  #message { min-height: 1.3em; color: var(--dim); text-align: center; width: 100%; max-width: 640px; }
  #message.alert { color: var(--warn); }
  .pad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 100%; max-width: 640px; }
  button { font: inherit; font-weight: 600; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; height: 52px; cursor: pointer; }
  button:active { background: #243048; }
  button:disabled { opacity: 0.35; cursor: default; }
  #start { background: #1a3a4a; border-color: var(--accent); }
  #stop { background: #3a1a22; border-color: var(--bad); }
  table { width: 100%; max-width: 640px; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.target { white-space: normal; word-break: break-word; }
  .pin { color: var(--accent); font-size: 11px; margin-left: 4px; }
  .off { color: var(--dim); font-style: italic; }
  .wrap { width: 100%; max-width: 640px; overflow-x: auto; }
  #count { color: var(--dim); font-size: 13px; width: 100%; max-width: 640px; }
  .hint { color: var(--dim); font-size: 13px; width: 100%; max-width: 640px; text-align: center; }
</style>
</head>
<body>
<header><h1>Overlay Effects</h1><span id="phase">idle</span></header>

<div class="big">
  <small>Frames per second</small>
  <b id="fps">0.0</b>
  <span id="fpsTarget">target 0</span>
</div>

<div class="stats">
  <div class="stat"><small>Frame ms avg</small><b id="avg">0</b></div>
  <div class="stat"><small>Frame ms max</small><b id="max">0</b></div>
  <div class="stat"><small>Late frames</small><b id="late">0</b></div>
  <div class="stat"><small>Data rate</small><b id="bps">0</b></div>
  <div class="stat"><small>Leases</small><b id="leases">0</b></div>
  <div class="stat"><small>Transport</small><b id="transport">-</b></div>
</div>
<div id="tick" class="hint" hidden></div>

<div id="message">Connecting...</div>

<div class="pad">
  <button id="start">Start</button>
  <button id="stop">Stop</button>
  <button id="reshuffle" title="Draw new effects for every target">Reshuffle</button>
</div>

<div id="count"></div>
<div class="wrap">
<table>
  <thead><tr><th>Target</th><th>Nodes</th><th>Lease</th><th>Effect</th></tr></thead>
  <tbody id="targets"></tbody>
</table>
</div>

<script>
  const el = (id) => document.getElementById(id);
  let app, status = null;

  function kb(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(2) + ' MB/s';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + ' kB/s';
    return n + ' B/s';
  }

  function render() {
    const s = status;
    if (!s) return;
    const running = s.phase === 'running';
    el('phase').textContent = s.phase;
    el('phase').className = s.phase;
    const target = s.fps?.target ?? 0, achieved = s.fps?.achieved ?? 0;
    const fps = el('fps');
    fps.textContent = achieved.toFixed(1);
    // Amber under 90% of target, red under 60%; only meaningful while running.
    fps.className = !running || !target ? '' : achieved < target * 0.6 ? 'bad' : achieved < target * 0.9 ? 'low' : '';
    el('fpsTarget').textContent = `target ${target}` + (running && target ? ` (${Math.round((achieved / target) * 100)}%)` : '');
    el('avg').textContent = (s.frameMs?.avg ?? 0).toFixed(1);
    const max = el('max');
    max.textContent = (s.frameMs?.max ?? 0).toFixed(1);
    max.className = running && target && s.frameMs?.max > 1000 / target ? 'warn' : '';
    const late = el('late');
    late.textContent = s.lateFrames ?? 0;
    late.className = s.lateFrames > 0 && running ? 'warn' : '';
    el('bps').textContent = kb(s.bytesPerSec ?? 0);
    el('leases').textContent = s.leases ?? 0;
    el('transport').textContent = (s.transport || '-').toUpperCase() + (s.sendErrors ? ` (${s.sendErrors} errors)` : '');
    // A coarse timer tick (Windows: about 15.6 ms) is what limits pacing above roughly 30 fps.
    const tick = s.timerTickMs ?? 0;
    el('tick').hidden = !(tick > 2 && target && 1000 / target < tick * 3);
    el('tick').textContent = `Node's timer ticks every ${tick.toFixed(1)} ms on this machine, so frames at ${target} fps start up to ${(tick / 2).toFixed(0)} ms early or late.`;
    el('message').textContent = s.message || '';
    el('message').className = /not configured|not reachable|could not|failed|not in the layout/i.test(s.message || '') ? 'alert' : '';
    el('start').disabled = s.phase !== 'idle';
    el('stop').disabled = s.phase !== 'running' && s.phase !== 'starting';

    const titles = Object.fromEntries((s.effects || []).map((e) => [e.name, e.title]));
    const n = s.targetCount ?? (s.targets || []).length;
    const m = s.modelCount ?? new Set((s.targets || []).map((t) => t.model)).size;
    const hidden = s.targetsListed === false ? ' (too many to list here)' : '';
    el('count').textContent = n ? `${n} targets on ${m} model${m === 1 ? '' : 's'}; seed ${s.seed}${hidden}` : '';
    // The rows ride along only when the list changed or every few seconds; otherwise the table stands.
    if (!Array.isArray(s.targets)) return;
    const rows = s.targets;
    const body = el('targets');
    body.replaceChildren();
    for (const t of rows) {
      const tr = document.createElement('tr');
      const lease = t.format === 'nodes' ? 'nodes' : `${t.format} ${t.width}x${t.height}`;
      const effect = t.effect ? (titles[t.effect] || t.effect) : '';
      tr.innerHTML = `<td class="target"></td><td class="num"></td><td></td><td></td>`;
      tr.children[0].textContent = t.target;
      tr.children[1].textContent = t.nodes;
      tr.children[2].textContent = lease;
      if (effect) {
        tr.children[3].textContent = effect;
        if (t.pinned) { const pin = document.createElement('span'); pin.className = 'pin'; pin.textContent = 'pinned'; tr.children[3].appendChild(pin); }
      } else {
        tr.children[3].innerHTML = '<span class="off">no effect enabled</span>';
      }
      body.appendChild(tr);
    }
  }

  function send(type) {
    if (!app) return;
    app.send({ type }).catch((e) => { el('message').textContent = `Could not send: ${e.message}`; el('message').className = 'alert'; });
  }
  el('start').addEventListener('click', () => send('start'));
  el('stop').addEventListener('click', () => send('stop'));
  el('reshuffle').addEventListener('click', () => send('reshuffle'));

  function init() {
    app = EZApp.connect();
    app.ready.catch((e) => { el('message').textContent = `Could not reach the player: ${e.message}`; el('message').className = 'alert'; });
    app.onStatus((s) => { if (s) { status = s; render(); } });
  }

  // The player serves the SDK next to every app page, on the LAN and through the cloud.
  const sdk = document.createElement('script');
  sdk.src = '_sdk.js';
  sdk.onload = init;
  sdk.onerror = () => { el('message').textContent = 'Could not load the app SDK.'; el('message').className = 'alert'; };
  document.head.appendChild(sdk);
</script>
</body>
</html>
