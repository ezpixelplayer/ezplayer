# Port 80 front end. The standalone portal stays private on loopback:8081.
map $http_upgrade $ezplayer_upgrade {
    default upgrade;
    '' close;
}
# Captive DNS sends arbitrary connectivity-check hostnames to this server.
# Redirect those hosts to a canonical setup URL, including vendor-specific probes.
map $host $ezplayer_unknown_host {
    default 1;
    ezplayer 0;
    ezplayer.local 0;
    localhost 0;
    ~^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$ 0;
}
# Reserve only the hotspot's base address for provisioning.
map "$server_addr:$uri" $ezplayer_hotspot_root {
    default 0;
    "192.168.4.1:/" 1;
}
server {
    listen 80 default_server;
    server_name ezplayer ezplayer.local _;
    client_max_body_size 0;
    if ($ezplayer_hotspot_root) { return 302 /setup; }
    if ($ezplayer_unknown_host) { return 302 http://$server_addr/setup; }
    # Do not record setup passwords, API query strings, or registration tokens.
    access_log off;
    # Connectivity probes must still lead phones into setup, not the player.
    location ~ ^/(generate_204|gen_204|hotspot-detect\.html|library/test/success\.html|connecttest\.txt|ncsi\.txt|canonical\.html|success\.txt|redirect|check_network_status\.txt)/?$ {
        return 302 http://$server_addr/setup;
    }
    location = /setup/ { return 302 /setup; }
    location = /setup {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-EZPlayer-Client-IP $remote_addr;
        proxy_set_header X-EZPlayer-Server-IP $server_addr;
    }
    location ^~ /api/network/ {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-EZPlayer-Client-IP $remote_addr;
        proxy_set_header X-EZPlayer-Server-IP $server_addr;
        proxy_read_timeout 60s;
    }
    # This existing player endpoint is restricted to actual loopback callers.
    # External requests must not gain that privilege through this proxy.
    location ~* ^/api/ezp/shell/reload(?:/|$) { return 403; }
    # Large coordinate JSON is fetched for both preview modes before rendering.
    # Compress just these non-credential responses; leave live streams alone.
    location ~ ^/api/ezp/model-coordinates(?:-2d)?$ {
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_comp_level 3;
        gzip_vary on;
        gzip_proxied any;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ezplayer_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
