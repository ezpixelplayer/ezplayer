name: Build & Release EZPlayer

permissions:
    contents: write

on:
    push:
        tags:
            - 'v*.*.*' # e.g. v1.0.0
            - 'v*.*.*-*'
    workflow_dispatch: # allow manual runs (build-only; no release unless a tag triggered it)

# Third-party actions are pinned to commit SHAs (tag in the trailing comment). This
# workflow holds the Apple signing identity; a hijacked action tag is the usual way
# CI secrets get exfiltrated. Bump the SHA + comment together when upgrading.

jobs:
    # Build each platform's artifacts WITHOUT publishing. Every job auto-publishing
    # concurrently is what produced duplicate GitHub releases (electron-builder's
    # find-or-create-release races across the matrix). Here jobs only upload their output
    # as workflow artifacts; the single `release` job below assembles one release.
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-2022]

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            # Use Python 3.11 to satisfy node-gyp/gyp's distutils import
            - name: Set up Python
              if: matrix.os != 'ubuntu-latest'
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.11'

            - name: Set Python for node-gyp (windows)
              if: matrix.os == 'windows-2022'
              run: |
                  python --version
                  echo "PYTHON=$(where python | head -1)" >> $GITHUB_ENV

            - name: Set up Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24

            - name: Set up pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
              with:
                  version: 10
                  run_install: false
                  cache: true

            - name: Install dependencies (workspace root)
              run: pnpm install --frozen-lockfile

            # The app's `build` runs `electron-builder --publish never` (see package.json),
            # so this produces installers + auto-update metadata (latest*.yml) but uploads
            # nothing. The depaudit gate also runs here, so a bad bundle fails before release.
            - name: Build app (no publish)
              run: pnpm run build

            - name: Run app unit tests
              run: pnpm --filter ezplayer-ui-electron test

            - name: Upload platform artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: release-${{ matrix.os }}
                  if-no-files-found: error
                  retention-days: 5
                  path: |
                      apps/ezplayer-ui-electron/release/*.exe
                      apps/ezplayer-ui-electron/release/*.exe.blockmap
                      apps/ezplayer-ui-electron/release/*.AppImage
                      apps/ezplayer-ui-electron/release/*.deb
                      apps/ezplayer-ui-electron/release/*.tar.gz
                      apps/ezplayer-ui-electron/release/*.yml

    # macOS is its own job (not in the matrix above) because it is the ONLY job that
    # may see the Apple Developer ID signing secrets. Those live in the `release`
    # GitHub Environment, which is restricted to v* tags + main and (optionally) gated
    # on a reviewer, so a collaborator cannot mint a signed build from an arbitrary
    # branch. The Linux/Windows matrix and the self-hosted Pi runner never get them.
    #
    # If the environment/secrets are absent the build still succeeds, just unsigned:
    # electron-builder logs "skipped macOS application code signing" and
    # "skipped macOS notarization" and produces the same dmgs as before.
    build-mac:
        runs-on: macos-latest
        environment: release

        steps:
            - name: Checkout repository
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            # Use Python 3.11 to satisfy node-gyp/gyp's distutils import
            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.11'

            - name: Set Python for node-gyp
              run: |
                  python --version
                  echo "PYTHON=$(which python)" >> $GITHUB_ENV

            - name: Set up Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24

            - name: Set up pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
              with:
                  version: 10
                  run_install: false
                  cache: true

            - name: Install dependencies (workspace root)
              run: pnpm install --frozen-lockfile

            # Translate the environment secrets into the env vars electron-builder reads
            # (https://www.electron.build/code-signing-mac). Done in a step rather than a
            # job-level `env:` because electron-builder treats an EMPTY CSC_LINK as a
            # certificate to import (and fails), whereas an unset one means "skip signing".
            #
            #   MAC_CSC_LINK          base64 of the Developer ID Application .p12
            #   MAC_CSC_KEY_PASSWORD  password for that .p12
            #   APPLE_API_KEY_BASE64  base64 of the App Store Connect API .p8 (notarization)
            #   APPLE_API_KEY_ID      the API key's Key ID
            #   APPLE_API_ISSUER      the App Store Connect Issuer ID
            - name: Configure macOS code signing + notarization
              env:
                  MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
                  MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
                  APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
                  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
              run: |
                  if [ -z "$MAC_CSC_LINK" ]; then
                    echo "::warning::MAC_CSC_LINK secret not available; building UNSIGNED mac dmgs"
                    exit 0
                  fi
                  {
                    echo "CSC_LINK=$MAC_CSC_LINK"
                    echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
                  } >> "$GITHUB_ENV"
                  echo "Code signing: enabled"

                  if [ -z "$APPLE_API_KEY_BASE64" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
                    echo "::warning::APPLE_API_* secrets incomplete; signing but NOT notarizing"
                    exit 0
                  fi
                  KEY_FILE="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
                  printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_FILE"
                  chmod 600 "$KEY_FILE"
                  {
                    echo "APPLE_API_KEY=$KEY_FILE"
                    echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
                    echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
                  } >> "$GITHUB_ENV"
                  echo "Notarization: enabled"

            - name: Build app (no publish)
              run: pnpm run build

            # Fail loudly if we had credentials but the output is not actually signed +
            # notarized, rather than shipping a dmg that Gatekeeper will reject.
            - name: Verify signature + notarization
              if: env.CSC_LINK != ''
              run: |
                  set -e
                  found=0
                  for app in apps/ezplayer-ui-electron/release/mac*/*.app; do
                    [ -d "$app" ] || continue
                    found=1
                    echo "== $app"
                    codesign --verify --deep --strict --verbose=2 "$app"
                    if [ -n "$APPLE_API_KEY" ]; then
                      spctl --assess --type execute --verbose=2 "$app"
                      xcrun stapler validate "$app"
                    fi
                  done
                  [ "$found" = 1 ] || { echo "no .app bundles found to verify"; exit 1; }

            - name: Run app unit tests
              run: pnpm --filter ezplayer-ui-electron test

            - name: Upload macOS artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: release-macos
                  if-no-files-found: error
                  retention-days: 5
                  path: |
                      apps/ezplayer-ui-electron/release/*.dmg
                      apps/ezplayer-ui-electron/release/*.dmg.blockmap
                      apps/ezplayer-ui-electron/release/*.zip
                      apps/ezplayer-ui-electron/release/*.yml

    # 64-bit Raspberry Pi (4/5) build on the lab's self-hosted ARM64 runner.
    # Only this workflow (tag push / workflow_dispatch — maintainer-controlled)
    # targets a self-hosted runner; the PR-triggered workflows use GitHub-hosted
    # runners, so untrusted fork code never runs on the lab hardware.
    # Deliberately NOT bound to the `release` environment: the Pi must never hold
    # the Apple signing secrets.
    build-pi:
        runs-on: [self-hosted, ARM64]

        steps:
            - name: Checkout repository
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Set up Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24

            - name: Set up pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
              with:
                  version: 10
                  run_install: false
                  cache: true

            - name: Install dependencies (workspace root)
              run: pnpm install --frozen-lockfile

            - name: Build app (no publish)
              run: pnpm run build

            - name: Run app unit tests
              run: pnpm --filter ezplayer-ui-electron test

            - name: Upload Pi arm64 artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: release-linux-arm64
                  if-no-files-found: error
                  retention-days: 5
                  path: |
                      apps/ezplayer-ui-electron/release/*-arm64.AppImage
                      apps/ezplayer-ui-electron/release/*_arm64.deb
                      apps/ezplayer-ui-electron/release/latest-linux-arm64.yml

    # Assemble ONE prerelease from all platforms. Only runs for tag pushes; a
    # workflow_dispatch on a branch builds (above) but does not release.
    release:
        needs: [build, build-mac, build-pi]
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest

        steps:
            - name: Download all platform artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  path: dist-artifacts
                  merge-multiple: true # flatten all release-* artifacts into one dir

            - name: Publish single GitHub prerelease
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  prerelease: true
                  fail_on_unmatched_files: true
                  files: dist-artifacts/**/*
