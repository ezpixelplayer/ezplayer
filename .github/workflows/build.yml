name: Build Check

on:
    pull_request:
        branches:
            - main
            - master
            - production
            - develop

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-2022, macos-latest]

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            # Use Python 3.11 to satisfy node-gyp/gyp's distutils import
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.11'

            - name: Set Python for node-gyp (unix)
              if: matrix.os != 'windows-2022'
              run: |
                  python --version
                  echo "PYTHON=$(which python)" >> $GITHUB_ENV

            - name: Set Python for node-gyp (windows)
              if: matrix.os == 'windows-2022'
              run: |
                  python --version
                  echo "PYTHON=$(where python | head -1)" >> $GITHUB_ENV

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            - name: Set up CI
              uses: pnpm/action-setup@v5
              with:
                  version: 10
                  run_install: false
                  cache: true

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build project
              run: pnpm run build

            # Unprivileged ICMP is off by default on some kernels; the runner
            # can turn it on, which is what a packaged Linux install expects.
            - name: Allow unprivileged ICMP (linux)
              if: matrix.os == 'ubuntu-latest'
              run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

            # Pings loopback through the native addon on each platform we ship.
            # REQUIRE_ICMP turns "no ICMP socket here" from a skip into a
            # failure, so a platform regression cannot hide as a skipped test.
            - name: Run ICMP ping tests
              run: pnpm --filter @ezplayer/icmp-ping test
              env:
                  REQUIRE_ICMP: '1'

            # Includes the real-ffmpeg conversion tests; fails if the ffmpeg-static
            # binary for this platform is missing.
            - name: Run app unit tests
              run: pnpm --filter ezplayer-ui-electron test
