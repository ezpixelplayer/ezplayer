name: Pi ARM64 Build

on:
    pull_request:
        branches: [main, master, production, develop]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pi-build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-pi:
        # Hosted ARM64 keeps PR code away from the lab's self-hosted Pi runner.
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - name: Set up Node
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24
            - name: Set up pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
              with:
                  version: 10
                  run_install: false
            - name: Install build and test prerequisites
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential python3 python3-dbus libgtk-3-0 libnss3 libasound2t64
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Test Pi service
              run: python3 -m unittest discover -s pi-appliance/tests -v
            - name: Build app
              run: pnpm run build
            - name: Test app
              run: pnpm --filter ezplayer-ui-electron test
            - name: Verify ARM64 installer
              shell: bash
              run: |
                  shopt -s nullglob
                  packages=(apps/ezplayer-ui-electron/release/*_arm64.deb)
                  (( ${#packages[@]} > 0 )) || { echo "ARM64 .deb missing"; exit 1; }
                  for package in "${packages[@]}"; do
                      test "$(dpkg-deb -f "$package" Architecture)" = arm64
                  done
            - name: Upload Pi installer and integration scripts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ezplayer-pi-arm64-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 14
                  path: |
                      apps/ezplayer-ui-electron/release/*_arm64.deb
                      apps/ezplayer-ui-electron/release/*-arm64.AppImage
                      pi-appliance/
