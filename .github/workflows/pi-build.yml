name: Pi ARM64 Build

on:
    pull_request:
        branches: [main, master, production, develop]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pi-build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-pi:
        # Hosted ARM64 keeps PR code away from the lab's self-hosted Pi runner.
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - name: Set up Node
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24
            - name: Set up pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
              with:
                  version: 10
                  run_install: false
            - name: Install build and test prerequisites
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential python3 python3-dbus python3-aiohttp libgtk-3-0 libnss3 libasound2t64 nginx libnginx-mod-stream openssl
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Test Pi service
              run: python3 -m unittest discover -s pi-appliance/tests -v
            - name: Test standalone network stack
              env:
                  NGINX_BINARY: /usr/sbin/nginx
                  NGINX_STREAM_MODULE: /usr/lib/nginx/modules/ngx_stream_module.so
              run: python3 -m unittest discover -s pi-network/tests -v
            - name: Build app
              run: pnpm run build
            - name: Test app
              run: pnpm --filter ezplayer-ui-electron test
            - name: Verify ARM64 installer
              shell: bash
              run: |
                  shopt -s nullglob
                  packages=(apps/ezplayer-ui-electron/release/*_arm64.deb)
                  (( ${#packages[@]} > 0 )) || { echo "ARM64 .deb missing"; exit 1; }
                  for package in "${packages[@]}"; do
                      test "$(dpkg-deb -f "$package" Architecture)" = arm64
                  done
            - name: Upload Pi installer and integration scripts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ezplayer-pi-arm64-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 14
                  path: |
                      apps/ezplayer-ui-electron/release/*_arm64.deb
                      apps/ezplayer-ui-electron/release/*-arm64.AppImage
                      pi-appliance/
                      pi-network/

    build-image:
        name: Build flashable Pi test image
        needs: build-pi
        if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/ezplayer-pi-appliance'
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 240
        steps:
            - name: Checkout matching source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - name: Download matching ARM64 installer
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
              with:
                  name: ezplayer-pi-arm64-${{ github.sha }}
                  path: pi-installer
            - name: Prepare native image builder
              run: |
                  sudo apt-get update
                  sudo apt-get install -y coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip dosfstools e2fsprogs libcap2-bin grep rsync xz-utils file git curl bc gpg pigz xxd arch-test bmap-tools kmod python3
                  # Reclaim only unused preinstalled SDKs on this disposable VM.
                  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
                  df -h /
            - name: Build fresh Raspberry Pi OS Lite image
              shell: bash
              run: |
                  mapfile -t packages < <(find pi-installer -name '*_arm64.deb' -type f)
                  (( ${#packages[@]} == 1 )) || { echo 'Expected exactly one ARM64 package'; exit 1; }
                  sudo --preserve-env=GITHUB_ACTIONS bash pi-appliance/build-test-image.sh "${packages[0]}" "$GITHUB_WORKSPACE/pi-image-output"
                  sudo chown -R "$(id -u):$(id -g)" pi-image-output
            - name: Verify compressed image
              run: |
                  xz -t pi-image-output/EZPlayer-Pi-test.img.xz
                  cd pi-image-output
                  sha256sum --check SHA256SUMS
            - name: Upload flashable image and test instructions
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ezplayer-pi-image-${{ github.sha }}
                  path: pi-image-output/
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 7
